name: OpenAPI / Postman Sync

on:
  pull_request:
    paths:
      - 'Stock Exchange/**'
      - 'Stock-Exchange.Application/**'
      - 'Stock-Exchange.Domain/**'
      - 'Stock-Exchange.Infrastructure/**'
      - 'Stock-Exchange.Persistance/**'
      - 'openapi/**'
      - 'postman/**'
      - 'scripts/**'
      - '.github/workflows/openapi-sync.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'Stock Exchange/**'
      - 'Stock-Exchange.Application/**'
      - 'Stock-Exchange.Domain/**'
      - 'Stock-Exchange.Infrastructure/**'
      - 'Stock-Exchange.Persistance/**'
      - 'openapi/**'
      - 'postman/**'
      - 'scripts/**'
      - '.github/workflows/openapi-sync.yml'

jobs:
  drift-check:
    name: Verify the OpenAPI document is up to date
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # appsettings*.json are git-ignored, so this checkout has no configuration. The API still
      # boots and serves its OpenAPI document (the deploy workflow relies on the same behaviour in
      # its smoke test), and the document generation never touches the database.
      - name: Generate the OpenAPI document
        shell: pwsh
        run: ./scripts/Update-OpenApi.ps1 -Launch -TimeoutSeconds 240

      - name: Generate the Postman collection
        shell: pwsh
        run: ./scripts/Update-PostmanCollection.ps1

      # openapi/v1.json and postman/StockExchange.postman_collection.json are committed on
      # purpose: Postman Connect Repository reads openapi/v1.json straight from the repository.
      # A developer who changed a controller without regenerating them would leave every team
      # member calling an outdated collection, so the build fails instead.
      - name: Fail when the committed artifacts are stale
        shell: pwsh
        run: |
          $changed = @(git status --porcelain -- openapi postman)
          if ($changed.Count -gt 0) {
            Write-Host '::error::Generated artifacts are out of date. Run scripts\Update-OpenApi.ps1 and scripts\Update-PostmanCollection.ps1, then commit the result.'
            $changed | ForEach-Object { Write-Host $_ }
            git --no-pager diff -- openapi postman
            exit 1
          }
          Write-Host 'Generated artifacts are up to date.'
