name: Deploy Stock Exchange API to MonsterASP

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'Stock Exchange/**'
      - 'Stock-Exchange.Application/**'
      - 'Stock-Exchange.Domain/**'
      - 'Stock-Exchange.Infrastructure/**'
      - 'Stock-Exchange.Persistance/**'
      - '.github/workflows/deploy-stock-exchange.yml'
      - '.github/workflows/ftp-deploy.py'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy Stock Exchange API
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # appsettings*.json are gitignored, so a plain checkout never contains them and the
      # published artifact used to ship without any configuration (no connection string, no
      # Google client id, no JWT secret). They are restored here from repository secrets.
      # A missing secret does not block the deployment: the app is hardened against missing
      # optional configuration, and the smoke test below fails the job if the site is unhealthy.
      - name: Restore appsettings from secrets
        id: config
        env:
          BASE_APPSETTINGS_BASE64: ${{ secrets.BASE_APPSETTINGS_BASE64 }}
          TEST_APPSETTINGS_BASE64: ${{ secrets.TEST_APPSETTINGS_BASE64 }}
          PRODUCTION_APPSETTINGS_BASE64: ${{ secrets.PRODUCTION_APPSETTINGS_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os

          targets = {
              "BASE_APPSETTINGS_BASE64": "Stock Exchange/appsettings.json",
              "TEST_APPSETTINGS_BASE64": "Stock Exchange/appsettings.Test.json",
              "PRODUCTION_APPSETTINGS_BASE64": "Stock Exchange/appsettings.Production.json",
          }

          missing = []
          for name, path in targets.items():
              value = os.environ.get(name, "").strip()
              if not value:
                  missing.append(name)
                  continue
              with open(path, "wb") as handle:
                  handle.write(base64.b64decode(value))
              print(f"restored {path}")

          if missing:
              print("")
              print("::warning::Missing appsettings secrets: " + ", ".join(missing))
              print("::warning::This build ships without configuration files, so Google sign-in, "
                    "database access and email sending will not work on the server until the "
                    "secrets are added to the repository.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("restored=" + ("false" if missing else "true") + "\n")
          PY

      - name: Publish Stock Exchange API
        run: |
          dotnet publish "Stock Exchange/Stock-Exchange.API.csproj" \
            -c Release \
            -o ./publish/stock-exchange

      - name: Deploy to MonsterASP via FTP
        env:
          FTP_SERVER: ${{ secrets.STOCK_EXCHANGE_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.STOCK_EXCHANGE_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STOCK_EXCHANGE_FTP_PASSWORD }}
          LOCAL_DIR: ./publish/stock-exchange
          REMOTE_DIR: /wwwroot
        run: python .github/workflows/ftp-deploy.py

      # Fails the job when the deployed site does not answer with a real OpenAPI document,
      # which is what a config-less or crashed deployment used to look like (masked 400).
      - name: Smoke test deployed site
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://stock-exchange.runasp.net' }}
        run: |
          for attempt in $(seq 1 12); do
            code=$(curl -s -o /tmp/swagger.json -w '%{http_code}' --max-time 30 "$SITE_URL/swagger/v1/swagger.json" || true)
            echo "attempt $attempt: HTTP $code"
            if [ "$code" = "200" ] && grep -q '"openapi"' /tmp/swagger.json; then
              echo "Deployed site is serving the OpenAPI document."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Deployed site did not serve a valid OpenAPI document after deployment."
          head -c 500 /tmp/swagger.json || true
          exit 1

  # Keeps the team Postman collection in step with the API without anyone importing anything.
  # It runs after a successful deploy, takes the document the deployed site already serves,
  # refreshes the committed artifacts, and pushes the collection to Postman through the
  # Postman API. Requires the repository secrets POSTMAN_API_KEY and POSTMAN_COLLECTION_ID.
  sync-postman:
    name: Sync OpenAPI document and Postman collection
    needs: build-and-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Save the document served by the deployed API
        shell: pwsh
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://stock-exchange.runasp.net' }}
        run: |
          # The smoke test above already proved the endpoint answers; download it again from
          # this job so the artifacts never depend on the previous job's runner.
          curl -sSf --max-time 60 "$SITE_URL/swagger/v1/swagger.json" -o /tmp/spec.json
          ./scripts/Save-OpenApiDocument.ps1 -InputPath /tmp/spec.json -Version v1

      - name: Rebuild the Postman collection
        shell: pwsh
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://stock-exchange.runasp.net' }}
        run: ./scripts/Update-PostmanCollection.ps1 -BaseUrl $env:SITE_URL

      # openapi/v1.json and postman/StockExchange.postman_collection.json are committed on
      # purpose: they are the reviewed history of the API surface. '[skip ci]' keeps this
      # commit from starting another deploy.
      - name: Commit the refreshed artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- openapi postman; then
            echo 'The API surface did not change; nothing to commit.'
            exit 0
          fi
          git add openapi postman
          git commit -m 'chore(api): sync OpenAPI document and Postman collection [skip ci]'
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Publish the collection to Postman
        shell: pwsh
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          POSTMAN_COLLECTION_ID: ${{ secrets.POSTMAN_COLLECTION_ID }}
        run: ./scripts/Publish-PostmanCollection.ps1
